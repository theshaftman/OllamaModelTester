[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "OllamaModelTester"
version = "0.0.1"
authors = [
    { name="Mariyan Vasilev Apostolov", email="mariyan.apostolov89@gmail.com" }
]
maintainers = [
    { name="Mariyan Vasilev Apostolov", email="mariyan.apostolov89@gmail.com" }
]
description = "A short description of the package"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux"
]

[project.urls]
Homepage = "https://github.com/theshaftman/OllamaModelTester"
Repository = "https://github.com/theshaftman/OllamaModelTester.git"
Issues = "https://github.com/theshaftman/OllamaModelTester/issues"
